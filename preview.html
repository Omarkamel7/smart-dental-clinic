<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عيادة د. كريم أبو بكر للأسنان - النسخة التفاعلية</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Cairo", Arial, sans-serif;
    }

    body {
      background-color: #0b132b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      color: #0f172a;
    }

    /* Mobile Shell Frame */
    .phone-container {
      width: 100%;
      max-width: 440px;
      height: 890px;
      background: #f8fafc;
      border-radius: 46px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 0 10px #1e293b, 0 0 0 12px #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Top Status Bar */
    .status-bar {
      background: #0284c7;
      color: white;
      padding: 10px 20px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      z-index: 40;
    }

    /* App Header */
    .app-header {
      background: #ffffff;
      padding: 10px 16px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
    }

    .header-branding {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      object-fit: cover;
    }

    .header-title {
      font-size: 14px;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.2;
    }

    .header-subtitle {
      font-size: 11px;
      color: #0284c7;
      font-weight: 700;
    }

    .header-lang-btn {
      border: 1px solid #cbd5e1;
      background: #f1f5f9;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      color: #334155;
    }

    /* Main Scrollable Content Area */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 85px;
    }

    /* Cards & Components */
    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 14px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
    }

    .hero-card {
      background: linear-gradient(135deg, #0369a1, #0284c7);
      color: white;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.25);
    }

    .doctor-avatar-circle {
      width: 65px;
      height: 65px;
      border-radius: 33px;
      border: 2.5px solid white;
      object-fit: cover;
      object-position: center 10%;
    }

    .hero-text h3 {
      font-size: 16px;
      font-weight: 900;
    }

    .hero-text p {
      font-size: 11px;
      opacity: 0.9;
      margin-top: 3px;
      line-height: 1.4;
    }

    /* Action Buttons */
    .action-card {
      background: white;
      border: 1.5px solid #e0f2fe;
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: all 0.2s;
    }

    .action-card:hover {
      border-color: #0284c7;
      transform: translateY(-2px);
    }

    .action-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #0284c7;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .action-info {
      flex: 1;
    }

    .action-info strong {
      font-size: 14px;
      color: #0f172a;
      display: block;
    }

    .action-info span {
      font-size: 11px;
      color: #64748b;
    }

    /* Chips Grid */
    .chips-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .chip-btn {
      padding: 8px 12px;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }

    .chip-btn.active {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0369a1;
      font-weight: 800;
    }

    /* Form Fields */
    .input-field {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 12px;
      background: #f8fafc;
      outline: none;
      margin-top: 5px;
    }

    .input-field:focus {
      border-color: #0284c7;
      background: white;
    }

    .textarea-field {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 12px;
      background: #f8fafc;
      outline: none;
      min-height: 80px;
      resize: vertical;
      margin-top: 5px;
    }

    .btn-primary {
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.3);
      transition: all 0.2s;
    }

    .btn-primary:hover {
      background: #0369a1;
    }

    /* Bottom Navigation Tab Bar */
    .tab-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: white;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 8px;
      z-index: 50;
    }

    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
      padding: 6px 0;
    }

    .tab-btn.active {
      color: #0284c7;
    }

    .tab-icon {
      font-size: 18px;
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
    }
    .badge-urgent { background: #fee2e2; color: #b91c1c; }
    .badge-pending { background: #fef3c7; color: #b45309; }
    .badge-done { background: #dcfce7; color: #15803d; }

    /* Chat Messages */
    .chat-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .chat-me {
      background: #0284c7;
      color: white;
      align-self: flex-start;
      border-bottom-right-radius: 4px;
    }
    .chat-other {
      background: #f1f5f9;
      color: #0f172a;
      align-self: flex-end;
      border-bottom-left-radius: 4px;
      border: 1px solid #e2e8f0;
    }

    /* Doctor Inbox Card */
    .inbox-card {
      background: white;
      border: 1.5px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .inbox-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <!-- Status Bar -->
    <div class="status-bar">
      <span>5G ● 100%</span>
      <span>عيادة د. كريم أبو بكر</span>
      <span>9:41 AM</span>
    </div>

    <!-- App Header -->
    <div class="app-header">
      <div class="header-branding">
        <img src="assets/app_logo.png" class="header-logo" alt="Logo" onerror="this.src='assets/icon.png'">
        <div>
          <div class="header-title" id="hdr-title">عيادة د. كريم أبو بكر</div>
          <div class="header-subtitle" id="hdr-subtitle">استشاري طب وجراحة الأسنان</div>
        </div>
      </div>
      <div id="doctor-badge-slot"></div>
    </div>

    <!-- Screen Content Area -->
    <div class="screen-content" id="screen-container">
      <!-- Injected via JavaScript -->
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="tab-bar">
      <button onclick="switchTab('home')" class="tab-btn active" id="tab-home">
        <span class="tab-icon">🏠</span>
        <span>الرئيسية</span>
      </button>
      <button onclick="switchTab('consultation')" class="tab-btn" id="tab-consultation">
        <span class="tab-icon">🩺</span>
        <span>استشارة سريعة</span>
      </button>
      <button onclick="switchTab('appointments')" class="tab-btn" id="tab-appointments">
        <span class="tab-icon">📅</span>
        <span>المواعيد</span>
      </button>
      <button onclick="switchTab('chat')" class="tab-btn" id="tab-chat">
        <span class="tab-icon">💬</span>
        <span>المحادثة</span>
      </button>
      <button onclick="switchTab('profile')" class="tab-btn" id="tab-profile">
        <span class="tab-icon">👤</span>
        <span>حسابي</span>
      </button>
    </div>
  </div>

  <script>
    // State Store
    const state = {
      role: 'patient', // 'patient' or 'doctor'
      currentTab: 'home',
      patientName: 'محمد أحمد',
      patientPhone: '+20 100 123 4567',
      selectedSymptoms: ['sharp_pain'],
      selectedSector: 'upper_right',
      painScore: 7,
      complaintDesc: '',
      attachedPhotos: ['assets/doctor_clinic.jpg'],
      consultations: [
        {
          id: 'c1',
          patientName: 'أحمد محمود',
          patientPhone: '01012345678',
          symptoms: ['ألم حاد ومفاجئ', 'حساسية مع البارد'],
          pain: 8,
          teeth: 'السن #16',
          desc: 'ألم مستمر في الضرس العلوي الأيمن مع شرب الماء البارد منذ يومين.',
          urgency: 'urgent',
          status: 'pending',
          time: 'منذ 10 دقائق',
          lastMsg: 'ألم مستمر في الضرس العلوي الأيمن...'
        }
      ],
      messages: [
        {
          id: 'm1',
          senderRole: 'patient',
          senderName: 'محمد أحمد',
          text: '🚨 طلب استشارة جديدة:\n• الأعراض: ألم حاد ومفاجئ\n• شدة الألم: 7/10\n• الموضع: فك علوي يمين',
          time: '09:30 ص'
        },
        {
          id: 'm2',
          senderRole: 'doctor',
          senderName: 'د. كريم أبو بكر',
          text: 'أهلاً بك يا محمد، تم فحص الشكوى. أنصح بتجنب الضغط على الجانب الأيمن وتناول مسكن لحين عمل أشعة بالعيادة.',
          time: '09:32 ص'
        }
      ]
    };

    function switchTab(tab) {
      state.currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-${tab}`);
      if (activeBtn) activeBtn.classList.add('active');
      render();
    }

    function toggleSymptom(symId) {
      if (state.selectedSymptoms.includes(symId)) {
        state.selectedSymptoms = state.selectedSymptoms.filter(s => s !== symId);
      } else {
        state.selectedSymptoms.push(symId);
      }
      render();
    }

    function loginDoctor() {
      const email = prompt('أدخل بريد الطبيب:', 'karim@smartdental.com');
      const pass = prompt('أدخل كلمة المرور:', '••••••••');
      if (email && email.includes('karim')) {
        state.role = 'doctor';
        state.currentTab = 'home';
        alert('مرحباً بك يا د. كريم أبو بكر! تم تسجيل الدخول كمدير للعيادة.');
        render();
      }
    }

    function logoutDoctor() {
      state.role = 'patient';
      alert('تم تسجيل الخروج والعودة لواجهة المريض.');
      render();
    }

    function submitConsultation() {
      const nameInput = document.getElementById('input-name');
      const phoneInput = document.getElementById('input-phone');
      const descInput = document.getElementById('input-desc');

      if (nameInput) state.patientName = nameInput.value;
      if (phoneInput) state.patientPhone = phoneInput.value;
      if (descInput) state.complaintDesc = descInput.value;

      if (!state.patientName || !state.patientPhone) {
        alert('يرجى إدخال اسمك ورقم الهاتف للرد عليك');
        return;
      }

      // Add to consultations & messages
      const newCons = {
        id: 'c_' + Date.now(),
        patientName: state.patientName,
        patientPhone: state.patientPhone,
        symptoms: state.selectedSymptoms,
        pain: state.painScore,
        teeth: state.selectedSector,
        desc: state.complaintDesc || 'استشارة وفحص مبدئي',
        urgency: state.painScore >= 8 ? 'urgent' : 'moderate',
        status: 'pending',
        time: 'الآن',
        lastMsg: state.complaintDesc || 'طلب استشارة جديد'
      };
      state.consultations.unshift(newCons);

      state.messages.push({
        id: 'm_' + Date.now(),
        senderRole: 'patient',
        senderName: state.patientName,
        text: `🚨 استشارة جديدة:\n• الأعراض: ${state.selectedSymptoms.join(', ')}\n• شدة الألم: ${state.painScore}/10\n• الوصف: ${state.complaintDesc || 'لا يوجد'}`,
        time: 'الآن'
      });

      alert('تم إرسال الشكوى بنجاح وبدء غرفة المحادثة مع د. كريم!');
      switchTab('chat');
    }

    function sendChat() {
      const input = document.getElementById('chat-text-input');
      if (!input || !input.value.trim()) return;
      state.messages.push({
        id: 'm_' + Date.now(),
        senderRole: state.role,
        senderName: state.role === 'doctor' ? 'د. كريم أبو بكر' : state.patientName,
        text: input.value.trim(),
        time: 'الآن'
      });
      input.value = '';
      render();
    }

    function render() {
      const container = document.getElementById('screen-container');
      const doctorBadgeSlot = document.getElementById('doctor-badge-slot');

      // Render Header Slot
      if (state.role === 'doctor') {
        doctorBadgeSlot.innerHTML = `
          <div style="background: #e0f2fe; color: #0284c7; padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 800;">
            ✓ وضع الطبيب
          </div>
        `;
      } else {
        doctorBadgeSlot.innerHTML = ``;
      }

      // 1. Home Tab
      if (state.currentTab === 'home') {
        if (state.role === 'doctor') {
          // Doctor Dashboard
          container.innerHTML = `
            <div class="hero-card">
              <img src="assets/doctor_clinic.jpg" class="doctor-avatar-circle" alt="Dr. Karim">
              <div class="hero-text">
                <h3>لوحة تحكم الطبيب د. كريم</h3>
                <p>مرحباً بك، لديك ${state.consultations.length} استشارات واردة من المرضى.</p>
              </div>
            </div>

            <!-- Clinic Management Grid -->
            <div class="card">
              <strong style="font-size: 12px; color: #0284c7; display: block; margin-bottom: 8px;">⚙️ إدارة بيانات ومحتوى العيادة:</strong>
              <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                <button onclick="alert('تعديل مواعيد وأرقام العيادة')" style="padding: 8px; font-size: 10px; font-weight: 800; background: #f0f9ff; border: 1px solid #0284c7; color: #0284c7; border-radius: 8px; cursor: pointer;">
                  ✏️ بيانات العيادة
                </button>
                <button onclick="alert('تعديل أسعار الخدمات')" style="padding: 8px; font-size: 10px; font-weight: 800; background: #f0fdf4; border: 1px solid #16a34a; color: #16a34a; border-radius: 8px; cursor: pointer;">
                  💲 الخدمات والأسعار
                </button>
                <button onclick="alert('رفع حالات جديدة')" style="padding: 8px; font-size: 10px; font-weight: 800; background: #fef3c7; border: 1px solid #d97706; color: #d97706; border-radius: 8px; cursor: pointer;">
                  🖼️ معرض الأعمال
                </button>
              </div>
            </div>

            <strong style="font-size: 13px; margin-top: 4px; display: block;">💬 استشارات ومحادثات المرضى الواردة:</strong>

            ${state.consultations.map(c => `
              <div class="inbox-card">
                <div class="inbox-header">
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <div style="width: 32px; height: 32px; border-radius: 16px; background: #0284c7; color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;">${c.patientName.charAt(0)}</div>
                    <div>
                      <strong style="font-size: 13px; display: block;">${c.patientName}</strong>
                      <span style="font-size: 10px; color: #64748b;">${c.patientPhone}</span>
                    </div>
                  </div>
                  <span class="badge ${c.urgency === 'urgent' ? 'badge-urgent' : 'badge-pending'}">${c.urgency === 'urgent' ? 'عاجلة' : 'متوسطة'}</span>
                </div>
                <div style="background: #f8fafc; padding: 8px; border-radius: 8px; font-size: 11px; margin: 6px 0; color: #334155;">
                  "${c.desc}"
                </div>
                <div style="display: flex; gap: 8px;">
                  <button onclick="switchTab('chat')" class="btn-primary" style="padding: 8px; font-size: 11px; flex: 1;">
                    💬 فتح المحادثة والرد
                  </button>
                  <button onclick="alert('تقرير تشخيص الحالة')" style="padding: 8px 12px; font-size: 11px; font-weight: 800; background: #f0fdf4; border: 1px solid #86efac; color: #166534; border-radius: 10px; cursor: pointer;">
                    🩺 تقرير الحالة
                  </button>
                </div>
              </div>
            `).join('')}
          `;
        } else {
          // Patient Home
          container.innerHTML = `
            <div class="hero-card">
              <img src="assets/doctor_clinic.jpg" class="doctor-avatar-circle" alt="Dr. Karim">
              <div class="hero-text">
                <h3>عيادة د. كريم أبو بكر</h3>
                <p>ابتسامتك في أيدٍ أمينة مع أحدث التقنيات الرقمية المتقدمة لطب وزراعة وتجميل الأسنان.</p>
              </div>
            </div>

            <!-- Quick Action Cards -->
            <div class="action-card" onclick="switchTab('consultation')">
              <div class="action-icon">🩺</div>
              <div class="action-info">
                <strong>طلب استشارة وفحص طبي فوري</strong>
                <span>حدد الأعراض والألم وتواصل مباشرة مع الطبيب</span>
              </div>
              <span style="color: #0284c7; font-weight: 900; font-size: 16px;">←</span>
            </div>

            <div class="action-card" onclick="switchTab('chat')">
              <div class="action-icon" style="background: #0d9488;">💬</div>
              <div class="action-info">
                <strong>محادثة الطبيب المباشرة</strong>
                <span>إرسال واستقبال الرسائل والصوت والصور</span>
              </div>
              <span style="color: #0d9488; font-weight: 900; font-size: 16px;">←</span>
            </div>

            <!-- Services Section -->
            <div class="card">
              <strong style="font-size: 13px; margin-bottom: 8px; display: block;">✨ خدمات العيادة المتميزة:</strong>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <div style="background: #f8fafc; padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0;">
                  <div style="font-size: 14px; margin-bottom: 2px;">💎</div>
                  <strong style="font-size: 12px; display: block;">تجميل وهوليود سمايل</strong>
                  <span style="font-size: 10px; color: #0284c7; font-weight: 800;">فينير وابتسامة رقمية</span>
                </div>
                <div style="background: #f8fafc; padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0;">
                  <div style="font-size: 14px; margin-bottom: 2px;">🦷</div>
                  <strong style="font-size: 12px; display: block;">زراعة الأسنان الفورية</strong>
                  <span style="font-size: 10px; color: #0284c7; font-weight: 800;">أحدث الغرسات الألمانية</span>
                </div>
              </div>
            </div>
          `;
        }
      }

      // 2. Consultation Intake Tab
      else if (state.currentTab === 'consultation') {
        container.innerHTML = `
          <div class="card" style="border-right: 4px solid #0284c7;">
            <strong style="font-size: 14px; color: #0369a1; display: block;">1️⃣ الأعراض الشائعة (اختر ما ينطبق):</strong>
            <div class="chips-grid">
              ${[
                { id: 'sharp_pain', label: '⚡ ألم حاد ومفاجئ' },
                { id: 'sensitivity', label: '❄️ حساسية مع البارد' },
                { id: 'gum_bleeding', label: '🩸 نزيف باللثة' },
                { id: 'broken_tooth', label: '🦷 كسر بالسن' },
                { id: 'swelling', label: '⚠️ تورم وانتفاخ' },
                { id: 'chewing_pain', label: '🍔 ألم عند المضغ' },
              ].map(s => `
                <div class="chip-btn ${state.selectedSymptoms.includes(s.id) ? 'active' : ''}" onclick="toggleSymptom('${s.id}')">
                  ${s.label} ${state.selectedSymptoms.includes(s.id) ? '✓' : ''}
                </div>
              `).join('')}
            </div>
          </div>

          <div class="card" style="border-right: 4px solid #0284c7;">
            <strong style="font-size: 14px; color: #0369a1; display: block;">2️⃣ موضع الألم والسن:</strong>
            <div class="chips-grid">
              ${[
                { id: 'upper_right', label: 'فك علوي (يمين)' },
                { id: 'upper_front', label: 'فك علوي (أمامي)' },
                { id: 'upper_left', label: 'فك علوي (يسار)' },
                { id: 'lower_right', label: 'فك سفلي (يمين)' },
                { id: 'lower_front', label: 'فك سفلي (أمامي)' },
                { id: 'lower_left', label: 'فك سفلي (يسار)' },
              ].map(sec => `
                <div class="chip-btn ${state.selectedSector === sec.id ? 'active' : ''}" onclick="state.selectedSector='${sec.id}'; render();">
                  ${sec.label}
                </div>
              `).join('')}
            </div>
          </div>

          <div class="card" style="border-right: 4px solid #0284c7;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <strong style="font-size: 14px; color: #0369a1;">3️⃣ شدة الألم الحالية:</strong>
              <span class="badge ${state.painScore >= 8 ? 'badge-urgent' : 'badge-pending'}">${state.painScore} / 10</span>
            </div>
            <input type="range" min="1" max="10" value="${state.painScore}" oninput="state.painScore = Number(this.value); render();" style="width:100%; margin: 8px 0; cursor:pointer;">
            <textarea id="input-desc" class="textarea-field" placeholder="صف الشكوى بالتفصيل وتاريخ بدء الألم...">${state.complaintDesc}</textarea>
          </div>

          <div class="card" style="border-right: 4px solid #0284c7;">
            <strong style="font-size: 14px; color: #0369a1; display: block;">4️⃣ بيانات التواصل:</strong>
            <input id="input-name" class="input-field" placeholder="اسم المريض بالكامل" value="${state.patientName}">
            <input id="input-phone" class="input-field" placeholder="رقم الهاتف / الواتساب" value="${state.patientPhone}">
          </div>

          <button class="btn-primary" onclick="submitConsultation()">
            <span>إرسال الشكوى وبدء المحادثة مع الطبيب</span>
            <span>💬</span>
          </button>
        `;
      }

      // 3. Appointments Tab
      else if (state.currentTab === 'appointments') {
        container.innerHTML = `
          <div class="card">
            <strong style="font-size: 14px; display: block; margin-bottom: 8px;">📅 حجز موعد كشف أو استشارة:</strong>
            <select class="input-field">
              <option>علاج وجذور وأعصاب - 900 ج.م</option>
              <option>حشوات تجميلية كمبوزيت - 450 ج.م</option>
              <option>تنظيف وتلميع وإزالة الجير - 350 ج.م</option>
              <option>كشف واستشارة طبية شاملة - 200 ج.م</option>
            </select>
            <input type="date" class="input-field" value="2026-08-28">
            <button class="btn-primary" style="margin-top: 12px; background: #0d9488;" onclick="alert('تم تأكيد حجز الموعد بنجاح والدفع بالعيادة!')">
              تأكيد حجز الموعد
            </button>
          </div>
        `;
      }

      // 4. Chat Tab
      else if (state.currentTab === 'chat') {
        container.innerHTML = `
          <div style="background: #f1f5f9; padding: 10px 14px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <img src="assets/doctor_clinic.jpg" style="width: 32px; height: 32px; border-radius: 16px; object-fit: cover;">
              <div>
                <strong style="font-size: 12px; display: block;">${state.role === 'doctor' ? state.patientName : 'د. كريم أبو بكر'}</strong>
                <span style="font-size: 9px; color: #16a34a;">● متاح للرد المباشر</span>
              </div>
            </div>
            <span class="badge badge-done">متصل</span>
          </div>

          <div style="flex: 1; display: flex; flex-direction: column; gap: 8px; margin: 10px 0;">
            ${state.messages.map(m => {
              const isMe = (state.role === 'doctor' && m.senderRole === 'doctor') || (state.role === 'patient' && m.senderRole === 'patient');
              return `
                <div class="chat-bubble ${isMe ? 'chat-me' : 'chat-other'}">
                  <div style="font-weight: 800; font-size: 10px; margin-bottom: 2px; opacity: 0.9;">${m.senderName}</div>
                  <div style="white-space: pre-line;">${m.text}</div>
                  <div style="font-size: 9px; opacity: 0.8; text-align: left; margin-top: 4px;">${m.time}</div>
                </div>
              `;
            }).join('')}
          </div>

          <div style="display: flex; gap: 6px; align-items: center;">
            <button onclick="alert('إرفاق صورة')" style="padding: 10px; background: white; border: 1.5px solid #cbd5e1; border-radius: 12px; cursor: pointer;">📷</button>
            <button onclick="alert('تسجيل رسالة صوتية')" style="padding: 10px; background: white; border: 1.5px solid #cbd5e1; border-radius: 12px; cursor: pointer;">🎤</button>
            <input id="chat-text-input" class="input-field" style="margin-top: 0; flex: 1;" placeholder="اكتب رسالتك للطبيب..." onkeydown="if(event.key==='Enter') sendChat()">
            <button onclick="sendChat()" style="padding: 10px 14px; background: #0284c7; color: white; border: none; border-radius: 12px; font-weight: 900; cursor: pointer;">➤</button>
          </div>
        `;
      }

      // 5. Profile Tab
      else if (state.currentTab === 'profile') {
        if (state.role === 'doctor') {
          container.innerHTML = `
            <div class="card" style="background: #e0f2fe; border: 1.5px solid #0284c7;">
              <strong style="color: #0369a1; font-size: 14px; display: block;">حساب الطبيب المعتمد</strong>
              <span style="font-size: 11px; color: #475569;">د. كريم أبو بكر (karim@smartdental.com)</span>
            </div>

            <div class="card">
              <button class="btn-primary" style="background: #dc2626; margin-top: 8px;" onclick="logoutDoctor()">
                🚪 تسجيل الخروج من حساب الطبيب
              </button>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div class="card">
              <strong style="font-size: 13px; display: block; margin-bottom: 8px;">👤 البيانات الشخصية:</strong>
              <input class="input-field" placeholder="الاسم" value="${state.patientName}" oninput="state.patientName = this.value">
              <input class="input-field" placeholder="رقم الهاتف" value="${state.patientPhone}" oninput="state.patientPhone = this.value">
            </div>

            <div class="card">
              <strong style="font-size: 13px; display: block; margin-bottom: 8px;">🏥 بيانات العيادة:</strong>
              <div style="font-size: 11px; color: #475569; line-height: 1.6;">
                <div>📍 شارع التحرير، برج الأطباء، الدور الرابع</div>
                <div>📞 +20 100 000 0000</div>
                <div>⏰ يومياً من 2 ظهراً حتى 10 مساءً</div>
              </div>
            </div>

            <button onclick="loginDoctor()" style="background: #f0f9ff; border: 1.5px dashed #0284c7; color: #0284c7; padding: 14px; border-radius: 14px; font-weight: 800; font-size: 12px; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;">
              <span>🔐 تسجيل دخول الطبيب والإدارة (Doctor Login)</span>
            </button>
          `;
        }
      }
    }

    // Initial render
    render();
  </script>
</body>
</html>
